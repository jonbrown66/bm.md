<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>bm.md</title>
    <style>
      html {
        scrollbar-gutter: stable;
      }

      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #bm-md {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Mermaid 直接融入文档纸面，保留留白而不额外套卡片。 */
      #bm-md .mermaid {
        max-width: 100%;
        margin: 1.5em 0;
      }

      #bm-md .mermaid > svg {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      body[data-show-image-caption='false'] #bm-md figcaption {
        display: none !important;
      }

      @media (max-width: 376px) {
        #bm-md {
          padding-top: 48px !important;
        }
      }

      /* 隐藏滚动条 */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        scrollbar-width: none;
      }
    </style>
  </head>

  <body data-show-image-caption="false"></body>
</html>
